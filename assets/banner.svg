<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="curveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="curveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="340" fill="url(#grid)" rx="16"/>

  <!-- Subtle Radial Background Accents -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.06"/>
  <circle cx="1050" cy="260" r="160" fill="#818cf8" opacity="0.08"/>
  <circle cx="600" cy="170" r="200" fill="#c084fc" opacity="0.04"/>

  <!-- DYNAMIC ANIMATED ELEMENTS (BACKGROUND & PERIPHERY - Title stays in Foreground) -->
  <!-- 1. Shaded Yield Curve Area (Underneath) -->
  <path d="M 0,260 Q 300,180 600,240 T 1200,150 L 1200,340 L 0,340 Z" fill="url(#areaGrad)"/>

  <!-- 2. Dynamic Pulsing Yield & Demand Waves -->
  <g opacity="0.55">
    <path d="M 0,260 Q 300,180 600,240 T 1200,150" fill="none" stroke="url(#curveGrad1)" stroke-width="3">
      <animate attributeName="d"
               values="M 0,260 Q 300,180 600,240 T 1200,150;
                       M 0,230 Q 300,270 600,160 T 1200,250;
                       M 0,260 Q 300,180 600,240 T 1200,150"
               dur="10s" repeatCount="indefinite"/>
    </path>

    <path d="M 0,210 Q 300,290 600,180 T 1200,220" fill="none" stroke="url(#curveGrad2)" stroke-width="2" stroke-dasharray="8,6">
      <animate attributeName="d"
               values="M 0,210 Q 300,290 600,180 T 1200,220;
                       M 0,270 Q 300,150 600,270 T 1200,160;
                       M 0,210 Q 300,290 600,180 T 1200,220"
               dur="12s" repeatCount="indefinite"/>
    </path>

    <!-- Animated Data Packet / Simulation Node travelling along the curve -->
    <path id="flowPath" d="M -40,280 C 300,100 800,300 1240,110" fill="none" stroke="none"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8" opacity="0.8">
      <animateMotion dur="7s" repeatCount="indefinite">
        <mpath href="#flowPath"/>
      </animateMotion>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#ec4899" opacity="0.8">
      <animateMotion dur="9s" begin="2s" repeatCount="indefinite">
        <mpath href="#flowPath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Left Dynamic Metric Card (Floating smoothly) -->
  <g transform="translate(60, 42)">
    <animateTransform attributeName="transform" type="translate"
                      values="60,42; 60,36; 60,42" dur="4s" repeatCount="indefinite"/>
    <rect width="210" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="22" cy="21" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="26" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">
      Dynamic Yield: +34.8%
    </text>
  </g>

  <!-- Right Dynamic Metric Card (Floating smoothly) -->
  <g transform="translate(930, 42)">
    <animateTransform attributeName="transform" type="translate"
                      values="930,42; 930,48; 930,42" dur="4.5s" repeatCount="indefinite"/>
    <rect width="210" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="22" cy="21" r="6" fill="#6366f1"/>
    <text x="38" y="26" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">
      AI Pricing &amp; RevPAR
    </text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, and Feature Pills (High contrast, centered, fully visible) -->
  <!-- Eyebrow Badge -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2"/>
    <text x="0" y="4" fill="#a5b4fc" font-size="11" class="sub-text" font-weight="700" letter-spacing="1.5">★ CURATED REVENUE INTELLIGENCE ★</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="148"
        text-anchor="middle"
        class="title-text"
        font-size="40"
        fill="url(#titleGrad)"
        letter-spacing="0.5">
    Awesome Revenue &amp; Yield Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="194"
        text-anchor="middle"
        class="sub-text"
        font-size="16"
        fill="url(#subGrad)"
        letter-spacing="0.3">
    Dynamic Pricing • Demand Forecasting • Inventory Optimization • Hospitality &amp; Travel Tech
  </text>

  <!-- Feature Pills Bottom Foreground -->
  <g transform="translate(600, 245)">
    <!-- Pill 1: Enterprise RMS -->
    <rect x="-370" y="0" width="165" height="30" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="-287" y="19" fill="#bae6fd" font-size="12" text-anchor="middle" class="sub-text">🏢 Enterprise RMS</text>

    <!-- Pill 2: Open Source Math -->
    <rect x="-185" y="0" width="175" height="30" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="-97" y="19" fill="#c7d2fe" font-size="12" text-anchor="middle" class="sub-text">📐 Open-Source Math</text>

    <!-- Pill 3: EMSR & Littlewood -->
    <rect x="10" y="0" width="175" height="30" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
    <text x="97" y="19" fill="#e9d5ff" font-size="12" text-anchor="middle" class="sub-text">⚡ EMSR &amp; Littlewood</text>

    <!-- Pill 4: Autonomous AI -->
    <rect x="205" y="0" width="165" height="30" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    <text x="287" y="19" fill="#a7f3d0" font-size="12" text-anchor="middle" class="sub-text">🤖 Autonomous AI</text>
  </g>

  <!-- Subtle Outer Border Accent -->
  <rect x="1" y="1" width="1198" height="338" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" rx="15" opacity="0.35"/>
</svg>
